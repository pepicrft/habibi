name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Version calculation must be serialized with publication, not just image builds.
concurrency:
  group: habibi-release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.version.outputs.should-release }}
      tag: ${{ steps.version.outputs.next-version }}
      number: ${{ steps.version.outputs.next-version-number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: "2026.9.1"
          install_args: "git-cliff jq"
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - id: version
        run: bash mise/tasks/release/check.sh

  checks:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, checks]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/pepicrft/habibi
      VERSION: ${{ needs.version.outputs.number }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: "2026.9.1"
          install_args: "git-cliff jq"
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - name: Reject a conflicting published tag
        id: tag
        run: |
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare release notes
        if: steps.tag.outputs.exists != 'true'
        run: bash mise/tasks/release/check.sh notes > "$RUNNER_TEMP/release-notes.md"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse the image when resuming a published release
        if: steps.tag.outputs.exists == 'true'
        id: existing
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ {print $2}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build and push the versioned image
        if: steps.tag.outputs.exists != 'true'
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pepicrft/habibi:${{ needs.version.outputs.number }}
          build-args: |
            HABIBI_VERSION=${{ needs.version.outputs.number }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the image digest
        if: steps.tag.outputs.exists != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          printf '\nImage: %s@%s\n' "$IMAGE" "$DIGEST" >> "$RUNNER_TEMP/release-notes.md"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: steps.tag.outputs.exists != 'true'
        with:
          target_commitish: ${{ github.sha }}
          name: Habibi ${{ needs.version.outputs.number }}
          tag_name: ${{ needs.version.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
      - name: Promote the published image to latest
        env:
          DIGEST: ${{ steps.image.outputs.digest || steps.existing.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

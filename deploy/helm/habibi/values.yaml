replicaCount: 2
image:
  repository: ghcr.io/pepicrft/habibi
  # Empty uses the chart appVersion; explicit tags and digest pins still win.
  tag: ""
  digest: ""
host: habibi.example.com
allowRegistration: false
poolSize: 5
platform:
  # Existing Flux deployment provisions storage and secrets with operators.
  enabled: true
external:
  # With platform.enabled=false, supply PostgreSQL/S3/runtime settings here.
  existingSecret: ""
  databaseCASecret: ""
networkPolicy:
  ingressNamespace: platform
analytics:
  enabled: false
  secretName: analytics-client
imagePullSecret:
  enabled: true
  existingSecret: ""
  secretStoreName: infisical-salibu
ingress:
  enabled: false
  className: nginx
  issuer: letsencrypt-cloudflare
postgres:
  image: ghcr.io/cloudnative-pg/postgresql:18.3-standard-trixie
  storageClass: hcloud-volumes
  storageSize: 10Gi
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
storage:
  bucketName: ""
backup:
  bucketName: ""
  endpoint: https://fsn1.your-objectstorage.com
  retention: 7d
  schedule: "0 15 3 * * *"
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
nodeSelector: {}

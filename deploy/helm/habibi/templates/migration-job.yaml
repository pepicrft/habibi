apiVersion: batch/v1
kind: Job
metadata:
  # An ordinary revision-scoped job can wait for first-install secrets/database.
  # A pre-install hook would run before those chart resources exist.
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "habibi.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "habibi.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ default (printf "%s-registry" .Release.Name) .Values.imagePullSecret.existingSecret }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "habibi.image" . | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/habibi", "eval", "Habibi.Release.migrate()"]
          {{- if not .Values.platform.enabled }}
          envFrom:
            - secretRef:
                name: {{ required "external.existingSecret is required when platform.enabled=false" .Values.external.existingSecret }}
          {{- end }}
          env:
            {{- include "habibi.env" . | nindent 12 }}
            - name: PHX_SERVER
              value: "false"
          securityContext:
            {{- include "habibi.security" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if or .Values.platform.enabled .Values.external.databaseCASecret }}
            - name: database-ca
              mountPath: /database
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        {{- if or .Values.platform.enabled .Values.external.databaseCASecret }}
        - name: database-ca
          secret:
            secretName: {{ if .Values.platform.enabled }}{{ .Release.Name }}-postgres-ca{{ else }}{{ .Values.external.databaseCASecret }}{{ end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

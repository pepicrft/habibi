{{- if .Values.platform.enabled }}
{{- range $name, $key := dict "secret-key-base" "SECRET_KEY_BASE" "release-cookie" "RELEASE_COOKIE" }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  length: 64
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $.Release.Name }}-{{ $name }}
    creationPolicy: Orphan
    template:
      engineVersion: v2
      data:
        {{ $key }}: {{ `{{ .password }}` | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $.Release.Name }}-{{ $name }}
{{- end }}
{{- if and .Values.imagePullSecret.enabled (not .Values.imagePullSecret.existingSecret) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.imagePullSecret.secretStoreName }}
  target:
    name: {{ .Release.Name }}-registry
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ `{"auths":{"ghcr.io":{"username":{{ .username | toJson }},"password":{{ .token | toJson }},"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}` | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: kubernetes/GHCR_PULL_USERNAME
    - secretKey: token
      remoteRef:
        key: kubernetes/GHCR_PULL_TOKEN
{{- end }}
{{- end }}
